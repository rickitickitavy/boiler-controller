<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lamp WiFi settings</title>
    <link rel="stylesheet" type="text/css" href="css/all.css"/>
    <script src="js/jq/jquery-3.4.1.js"></script>
    <script language="JavaScript">

        var manual_oxygen_door_opened_for_sec = 0;
        var main_door_opened = false;
        var main_door_element;

        function blinkMainDoor(){
            if (main_door_opened) {
                if (main_door_element.classList.contains("svg-main-door-opened")) {
                    main_door_element.classList.remove("svg-main-door-opened");
                    main_door_element.classList.add("svg-core-inner");
                } else {
                    main_door_element.classList.add("svg-main-door-opened");
                    main_door_element.classList.remove("svg-core-inner");
                }
            } else if (main_door_element.classList.contains("svg-main-door-opened")) {
                main_door_element.classList.remove("svg-main-door-opened");
                main_door_element.classList.add("svg-core-inner");
            }
        }

        function updateGraph(response) {
            document.getElementById("core_temperature").innerHTML = "T= " + response.temperature.core;
            document.getElementById("core_power").innerHTML = "P= " + response.core_power;

            document.getElementById("power_balance").innerHTML = "+накоп/-расх= " + response.power_balance + "kW";
            document.getElementById("accumulated_power").innerHTML = "Aккум.= " + response.accumulated_power + "kW*h";

            document.getElementById("core_flow").innerHTML = "Q= " + response.pumps.core_flow + "л/мин";
            document.getElementById("oxygen_door").innerHTML = "A= " + response.doors.oxygen + "%%";
            document.getElementById("upper_door").innerHTML = "A= " + response.doors.upper + "%%";
            document.getElementById("smoke_door").innerHTML = "A= " + response.doors.smoke + "%%";

            document.getElementById("acc_top_t").innerHTML = "T= " + response.temperature.acc_top;
            document.getElementById("acc_upper_t").innerHTML = "T= " + response.temperature.acc_upper;
            document.getElementById("acc_lower_t").innerHTML = "T= " + response.temperature.acc_low;
            document.getElementById("acc_bottom_t").innerHTML = "T= " + response.temperature.acc_bottom;
            document.getElementById("core_input").innerHTML = "T= " + response.temperature.input_t;
            document.getElementById("core_output").innerHTML = "T= " + response.temperature.output_t;

            document.getElementById("backward_temperature").innerHTML = "T= " + response.temperature.backward_from_home;
            document.getElementById("forward_temperature").innerHTML = "T= " + response.temperature.forward_to_home;

            main_door_opened = response.doors.main_door == "ON";
            manual_oxygen_door_opened_for_sec = response.doors.oxygenManualTimer;
            var oxy_door_text = document.getElementById("open_close_oxy_text");
            if (manual_oxygen_door_opened_for_sec != 0){
                if (oxy_door_text.classList.contains("svg-oxy-door-control-green-text")) {
                    oxy_door_text.classList.remove("svg-oxy-door-control-green-text");
                    oxy_door_text.classList.add("svg-oxy-door-control-red-text");
                }
                oxy_door_text.innerHTML = "Opened for " + Math.floor(manual_oxygen_door_opened_for_sec / 60) + ":" + manual_oxygen_door_opened_for_sec % 60;
            } else if (oxy_door_text.classList.contains("svg-oxy-door-control-red-text")) {
                oxy_door_text.classList.remove("svg-oxy-door-control-red-text");
                oxy_door_text.classList.add("svg-oxy-door-control-green-text");
                oxy_door_text.innerHTML = "Откр. на 15 мин";
            }

            var pump1 = document.getElementById("pump1");
            if (response.pumps.pump_1_on) {
                if (pump1.classList.contains("svg-pump-off")) {
                    pump1.classList.remove("svg-pump-off");
                    pump1.classList.add("svg-pump-on");
                }
            } else if (pump1.classList.contains("svg-pump-on")) {
                pump1.classList.remove("svg-pump-on");
                pump1.classList.add("svg-pump-off");
            }

            var pump2 = document.getElementById("pump2");
            if (response.pumps.pump_2_on) {
                if (pump2.classList.contains("svg-pump-off")) {
                    pump2.classList.remove("svg-pump-off");
                    pump2.classList.add("svg-pump-on");
                }
            } else if (pump2.classList.contains("svg-pump-on")) {
                pump2.classList.remove("svg-pump-on");
                pump2.classList.add("svg-pump-off");
            }

            document.getElementById("pump1_arrow").style.stroke = response.pumps.pump_1_on ? "green" : "red";
            document.getElementById("pump2_arrow").style.stroke = response.pumps.pump_2_on ? "green" : "red";

            document.getElementById("pid_p").innerHTML = "p= " + response.pid.p;
            document.getElementById("pid_i").innerHTML = "i= " + response.pid.i;
            document.getElementById("pid_d").innerHTML = "d= " + response.pid.d;
            document.getElementById("pid_output").innerHTML = "out= " + response.pid.output;

            var mode;
            switch (response.mode) {
                case 1:
                    mode = "ХОЛОДНЫЙ";
                    break;
                case 2:
                    mode = "РАЗОГРЕВ";
                    break;
                case 4:
                    mode = "ОТОПЛЕНИЕ";
                    break;
                case 8:
                    mode = "ОСТУЖЕНИЕ";
                    break;
                case 16:
                    mode = "ПЕРЕГРЕВ";
                    break;
                case 32:
                    mode = "КРИТИЧЕСКИЙ ПЕРЕГРЕВ";
                    break;

            }
            document.getElementById("core_mode").innerHTML = "Режим: " + mode;
        }

        function getTelemetry() {
            $.ajax({
                url: "/getTelemetry",
                method: "GET",
                data: "on=0",
                success: function (response) {
                    updateGraph(response);
                }.bind(this),
                error: function (error) {
                    if (error.status == 200)
                        alert("bad JSON");
                }.bind(this),
                dataType: "json"
            });
        }


        function loaded() {
            main_door_element = document.getElementById("main_door");
            window.setInterval(getTelemetry, 1000);
            window.setInterval(blinkMainDoor, 250);
        }

        function openOrCloseOxygenDoor() {
            $.ajax({
                url: manual_oxygen_door_opened_for_sec == 0 ? "/openDoorFor15Min" : "/closeDoor",
                method: "GET",
                data: "on=0",
                success: function (response) {
                    getTelemetry();
                }.bind(this),
                error: function (error) {
                    if (error.status == 200)
                        alert("bad JSON");
                }.bind(this),
                dataType: "json"
            });
        }

    </script>
</head>
