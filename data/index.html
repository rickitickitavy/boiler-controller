<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lamp WiFi settings</title>
    <link rel="stylesheet" type="text/css" href="css/all.css"/>
    <script src="js/jq/jquery-3.4.1.js"></script>
    <script language="JavaScript">

        function updateGraph(response){
            document.getElementById("core_temperature").innerHTML = "T= " + response.temperature.core;
            document.getElementById("core_power").innerHTML = "P= " + response.core_power;
            document.getElementById("core_flow").innerHTML = "Q= " + response.pumps.core_flow;
            document.getElementById("oxygen_door").innerHTML = "A= " + response.doors.oxygen;
            document.getElementById("upper_door").innerHTML = "A= " + response.doors.upper;
            document.getElementById("smoke_door").innerHTML = "A= " + response.doors.smoke;

            document.getElementById("acc_top_t").innerHTML = "T= " + response.temperature.acc_top;
            document.getElementById("acc_upper_t").innerHTML = "T= " + response.temperature.acc_upper;
            document.getElementById("acc_lower_t").innerHTML = "T= " + response.temperature.acc_low;
            document.getElementById("acc_bottom_t").innerHTML = "T= " + response.temperature.acc_bottom;
            document.getElementById("core_input").innerHTML = "T= " + response.temperature.input_t;
            document.getElementById("core_output").innerHTML = "T= " + response.temperature.output_t;

            document.getElementById("pump1").style.stroke = response.pumps.pump_1_on ? "green" : "red";
            document.getElementById("pump2").style.stroke = response.pumps.pump_2_on ? "green" : "red";

            document.getElementById("pid_p").innerHTML = "p= " + response.pid.p;
            document.getElementById("pid_i").innerHTML = "i= " + response.pid.i;
            document.getElementById("pid_d").innerHTML = "d= " + response.pid.d;
            document.getElementById("pid_output").innerHTML = "out= " + response.pid.output;
        }

        function loaded() {
            var stopModellingFunction = function () {
                $.ajax({
                    url: "/getTelemetry",
                    method: "GET",
                    data: "on=0",
                    success: function (response) {
                        updateGraph(response);
                    }.bind(this),
                    error: function (error) {
                        if (error.status == 200)
                            alert("bad JSON");
                    }.bind(this),
                    dataType: "json"
                });

            };

            window.setInterval(stopModellingFunction, 1000);
        }

    </script>
</head>
