; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:esp12e]
;platform = espressif8266
;board = esp12e
;framework = arduino
;board_build.f_cpu = 40000000L
;board_build.f_flash = 40000000L
;upload_speed = 921600
;monitor_speed = 115200

;upload_protocol=espota
;upload_resetmethod = nodemcu
;upload_port=192.168.4.89

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/patch_asyncwebserver_template_len.py
board_build.filesystem = littlefs
board_build.partitions = default.csv
upload_speed = 921600
;monitor_speed = 115200
monitor_speed = 115200
upload_resetmethod = nodemcu
;upload_port = 192.168.4.210
;upload_protocol = espota
;upload_port=/dev/ttyUSB0

; upload_protocol=espota
; upload_port=192.168.4.218

lib_deps =
    me-no-dev/AsyncTCP@3.3.2
    me-no-dev/ESPAsyncWebServer@3.6.0
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.2

; Unused Arduino bundled libs — keep flash under stock 4MB default OTA slots.
lib_ignore =
    BLE
    BluetoothSerial
    WiFiProv
    Zigbee
    Matter
    OpenThread
    RainMaker
    NetworkClientSecure
    ESP_I2S
    ESP_NOW
    ESP_SR
    Insights
    SimpleBLE
    USB

; Disable Bluetooth in the IDF sdkconfig used by pioarduino.
custom_sdkconfig =
    '# CONFIG_BT_ENABLED is not set'
    '# CONFIG_BT_NIMBLE_ENABLED is not set'
    '# CONFIG_BT_CONTROLLER_ENABLED is not set'
    CONFIG_BT_CONTROLLER_DISABLED=y

; Lab build with ArduinoOTA / espota (HTTP Update remains in both envs).
[env:esp32dev_ota]
extends = env:esp32dev
build_flags = -DENABLE_ARDUINO_OTA
